<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iCheck — iPhone Second Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #7DF9C0;
    --accent2: #4FC3F7;
    --danger: #FF6B6B;
    --warn: #FFD166;
    --text: #F0F0F8;
    --muted: #6b6b8a;
    --radius: 16px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 0 0 80px;
  }

  /* BG texture */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 40% at 20% 0%, rgba(125,249,192,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 50% at 80% 100%, rgba(79,195,247,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { max-width: 680px; margin: 0 auto; padding: 0 16px; position: relative; z-index: 1; }

  /* HEADER */
  header {
    padding: 36px 16px 0;
    max-width: 680px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 28px;
    letter-spacing: -1px;
  }

  .logo span { color: var(--accent); }

  .lang-toggle {
    display: flex;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 3px;
    gap: 2px;
  }

  .lang-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.5px;
  }

  .lang-btn.active {
    background: var(--accent);
    color: #0a0a0f;
    font-weight: 500;
  }

  .header-sub {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 28px;
    font-weight: 300;
  }

  /* PROGRESS */
  .progress-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 24px;
    margin-bottom: 24px;
  }

  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .progress-label {
    font-family: 'Syne', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--muted);
    text-transform: uppercase;
  }

  .progress-count {
    font-family: 'DM Mono', monospace;
    font-size: 22px;
    font-weight: 500;
    color: var(--accent);
  }

  .progress-count span { color: var(--muted); font-size: 14px; }

  .progress-bar-wrap {
    background: var(--surface2);
    border-radius: 100px;
    height: 8px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    width: 0%;
  }

  .progress-phases {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .phase-pill {
    font-family: 'DM Mono', monospace;
    font-size: 10px;
    padding: 3px 10px;
    border-radius: 100px;
    border: 1px solid var(--border);
    color: var(--muted);
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }

  .phase-pill.done { border-color: var(--accent); color: var(--accent); }
  .phase-pill.active { border-color: var(--accent2); color: var(--accent2); background: rgba(79,195,247,0.08); }

  /* PHASES */
  .phase {
    margin-bottom: 20px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    background: var(--surface);
    transition: border-color 0.3s;
  }

  .phase.phase-complete { border-color: rgba(125,249,192,0.3); }

  .phase-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 20px;
    cursor: pointer;
    user-select: none;
    transition: background 0.2s;
  }

  .phase-header:hover { background: rgba(255,255,255,0.02); }

  .phase-num {
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    width: 28px;
    height: 28px;
    border-radius: 8px;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    flex-shrink: 0;
    transition: all 0.2s;
  }

  .phase.phase-complete .phase-num {
    background: var(--accent);
    border-color: var(--accent);
    color: #0a0a0f;
  }

  .phase-title-wrap { flex: 1; }

  .phase-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 2px;
  }

  .phase-meta {
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  .phase-chevron {
    color: var(--muted);
    transition: transform 0.3s;
    font-size: 14px;
  }

  .phase.open .phase-chevron { transform: rotate(180deg); }

  .phase-body {
    display: none;
    border-top: 1px solid var(--border);
  }

  .phase.open .phase-body { display: block; }

  /* CHECK ITEMS */
  .check-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 14px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
  }

  .check-item:last-child { border-bottom: none; }
  .check-item:hover { background: rgba(255,255,255,0.02); }
  .check-item.checked { opacity: 0.6; }

  .check-box {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    border: 1.5px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1px;
    transition: all 0.2s;
    background: transparent;
  }

  .check-item.checked .check-box {
    background: var(--accent);
    border-color: var(--accent);
  }

  .check-icon {
    opacity: 0;
    font-size: 11px;
    transition: opacity 0.2s;
    color: #0a0a0f;
  }

  .check-item.checked .check-icon { opacity: 1; }

  .check-content { flex: 1; }

  .check-title {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 3px;
    transition: text-decoration 0.2s;
  }

  .check-item.checked .check-title { text-decoration: line-through; color: var(--muted); }

  .check-desc {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
    font-weight: 300;
  }

  .check-tag {
    font-family: 'DM Mono', monospace;
    font-size: 9px;
    padding: 2px 8px;
    border-radius: 100px;
    border: 1px solid;
    letter-spacing: 0.5px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .tag-critical { border-color: rgba(255,107,107,0.5); color: var(--danger); background: rgba(255,107,107,0.08); }
  .tag-warn { border-color: rgba(255,209,102,0.5); color: var(--warn); background: rgba(255,209,102,0.08); }
  .tag-info { border-color: rgba(79,195,247,0.5); color: var(--accent2); background: rgba(79,195,247,0.08); }

  /* IMEI LINKS SECTION */
  .imei-section {
    background: var(--surface2);
    border-top: 1px solid var(--border);
    padding: 16px 20px;
  }

  .imei-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .imei-links {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .imei-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 7px 12px;
    text-decoration: none;
    color: var(--accent2);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    transition: all 0.2s;
  }

  .imei-link:hover {
    border-color: var(--accent2);
    background: rgba(79,195,247,0.06);
  }

  /* VERDICT */
  .verdict-card {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    text-align: center;
    background: var(--surface);
    display: none;
  }

  .verdict-card.show { display: block; }

  .verdict-emoji { font-size: 40px; margin-bottom: 12px; }

  .verdict-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin-bottom: 8px;
  }

  .verdict-desc {
    font-size: 13px;
    color: var(--muted);
    font-weight: 300;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .verdict-layak { border-color: rgba(125,249,192,0.4); }
  .verdict-layak .verdict-title { color: var(--accent); }

  .verdict-hati { border-color: rgba(255,209,102,0.4); }
  .verdict-hati .verdict-title { color: var(--warn); }

  .verdict-tolak { border-color: rgba(255,107,107,0.4); }
  .verdict-tolak .verdict-title { color: var(--danger); }

  /* BUTTONS */
  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border: none;
    transition: all 0.2s;
    text-decoration: none;
  }

  .btn-wa {
    background: #25D366;
    color: #fff;
  }

  .btn-wa:hover { background: #20bc5a; transform: translateY(-1px); }

  .btn-reset {
    background: var(--surface2);
    color: var(--muted);
    border: 1px solid var(--border);
  }

  .btn-reset:hover { color: var(--text); border-color: var(--muted); }

  .btn-copy {
    background: var(--surface2);
    color: var(--accent2);
    border: 1px solid rgba(79,195,247,0.3);
  }

  .btn-copy:hover { background: rgba(79,195,247,0.08); }

  /* FOOTER */
  .footer {
    text-align: center;
    padding: 32px 16px 0;
    font-size: 11px;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
  }

  /* ANIMATIONS */
  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .phase { animation: fadeSlide 0.3s ease both; }
  .phase:nth-child(1) { animation-delay: 0.05s; }
  .phase:nth-child(2) { animation-delay: 0.1s; }
  .phase:nth-child(3) { animation-delay: 0.15s; }
  .phase:nth-child(4) { animation-delay: 0.2s; }

  @keyframes checkPop {
    0% { transform: scale(1); }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  .check-item.just-checked .check-box { animation: checkPop 0.25s ease; }

  /* MOBILE */
  @media (max-width: 480px) {
    .logo { font-size: 22px; }
    .phase-title { font-size: 14px; }
    .btn-row { flex-direction: column; }
    .btn { justify-content: center; }
  }
</style>

const translations = {

const imeiLinks = [
  { label: 'Kemenperin', url: 'https://imei.kemenperin.go.id', emoji: '🇮🇩' },
  { label: 'imei.info', url: 'https://www.imei.info', emoji: '🔍' },
  { label: 'imeipro.info', url: 'https://imeipro.info', emoji: '🔒' },
  { label: 'Apple Coverage', url: 'https://checkcoverage.apple.com', emoji: '🍎' },
];

const state = {};
phases.forEach(p => p.items.forEach(item => state[item.id] = false));

function setLang(l) {
  lang.current = l;
  document.getElementById('btn-id').classList.toggle('active', l === 'id');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('header-sub').textContent = translations.headerSub[l];
  document.getElementById('footer-text').textContent = translations.footerText[l];
  document.getElementById('btn-wa-text').textContent = translations.waText[l];
  document.getElementById('btn-copy-text').textContent = translations.copyText[l];
  document.getElementById('btn-reset-text').textContent = translations.resetText[l];

  // Update phase pills
  document.querySelectorAll('.phase-pill').forEach(pill => {
    pill.textContent = pill.getAttribute(`data-${l}-text`);
  });

  // Update imei label
  const imeiLabel = document.querySelector('.imei-label');
  if (imeiLabel) imeiLabel.textContent = translations.imeiLabel[l];

  // Re-render phases
  renderPhases();
  updateProgress();
  updateVerdict();
}

function toggleItem(id) {
  state[id] = !state[id];
  const el = document.querySelector(`[data-id="${id}"]`);
  if (el) {
    el.classList.toggle('checked', state[id]);
    if (state[id]) {
      el.classList.add('just-checked');
      setTimeout(() => el.classList.remove('just-checked'), 300);
    }
  }
  updateProgress();
  updateVerdict();
  updatePhasePills();
}

function togglePhase(phaseId) {
  const el = document.getElementById(`phase-${phaseId}`);
  if (el) el.classList.toggle('open');
}

function getTotalItems() {
  return Object.keys(state).length;
}

function getCheckedCount() {
  return Object.values(state).filter(Boolean).length;
}

function getCriticalItems() {
  const criticals = [];
  phases.forEach(p => p.items.forEach(item => {
    if (item.tag === 'critical') criticals.push(item.id);
  }));
  return criticals;
}

function updateProgress() {
  const total = getTotalItems();
  const checked = getCheckedCount();
  const pct = total ? (checked / total) * 100 : 0;

  document.getElementById('checked-count').textContent = checked;
  document.getElementById('total-count').textContent = total;
  document.getElementById('progress-fill').style.width = pct + '%';
}

function updatePhasePills() {
  phases.forEach((phase, i) => {
    const pill = document.getElementById(`pill-${i}`);
    if (!pill) return;
    const total = phase.items.length;
    const checked = phase.items.filter(item => state[item.id]).length;
    pill.classList.remove('done', 'active');
    if (checked === total) pill.classList.add('done');
    else if (checked > 0) pill.classList.add('active');
  });
}

function updateVerdict() {
  const total = getTotalItems();
  const checked = getCheckedCount();
  const criticals = getCriticalItems();
  const allCriticalDone = criticals.every(id => state[id]);
  const card = document.getElementById('verdict-card');
  const title = document.getElementById('verdict-title');
  const desc = document.getElementById('verdict-desc');
  const emoji = document.getElementById('verdict-emoji');
  const l = lang.current;

  if (checked === 0) { card.classList.remove('show'); return; }

  card.classList.add('show');
  card.className = 'verdict-card show';

  if (checked === total && allCriticalDone) {
    card.classList.add('verdict-layak');
    emoji.textContent = '✅';
    title.textContent = translations.verdictLayakTitle[l];
    desc.textContent = translations.verdictLayakDesc[l];
  } else if (!allCriticalDone && checked > total * 0.5) {
    card.classList.add('verdict-tolak');
    emoji.textContent = '🚫';
    title.textContent = translations.verdictTolakTitle[l];
    desc.textContent = translations.verdictTolakDesc[l];
  } else {
    card.classList.add('verdict-hati');
    emoji.textContent = '⚠️';
    title.textContent = translations.verdictHatiTitle[l];
    desc.textContent = translations.verdictHatiDesc[l];
  }
}

function buildResult() {
  const l = lang.current;
  const checked = getCheckedCount();
  const total = getTotalItems();
  const pct = Math.round((checked / total) * 100);
  let text = l === 'id'
    ? `📱 *iCheck — Hasil Cek iPhone Second*\n\nProgress: ${checked}/${total} (${pct}%)\n\n`
    : `📱 *iCheck — Used iPhone Check Result*\n\nProgress: ${checked}/${total} (${pct}%)\n\n`;

  phases.forEach(p => {
    text += `*${p.title[l]}*\n`;
    p.items.forEach(item => {
      const icon = state[item.id] ? '✅' : '⬜';
      text += `${icon} ${item.title[l]}\n`;
    });
    text += '\n';
  });

  text += l === 'id'
    ? '_Dibuat dengan iCheck — panduan beli iPhone second_'
    : '_Made with iCheck — used iPhone buying guide_';
  return text;
}

function shareWA() {
  const text = encodeURIComponent(buildResult());
  window.open(`https://wa.me/?text=${text}`, '_blank');
}

function copyResult() {
  navigator.clipboard.writeText(buildResult()).then(() => {
    const btn = document.getElementById('btn-copy-btn');
    const span = document.getElementById('btn-copy-text');
    const orig = span.textContent;
    span.textContent = lang.current === 'id' ? 'Tersalin!' : 'Copied!';
    btn.style.borderColor = 'var(--accent)';
    btn.style.color = 'var(--accent)';
    setTimeout(() => {
      span.textContent = orig;
      btn.style.borderColor = '';
      btn.style.color = '';
    }, 2000);
  });
}

function resetAll() {
  Object.keys(state).forEach(k => state[k] = false);
  document.querySelectorAll('.check-item').forEach(el => el.classList.remove('checked'));
  document.querySelectorAll('.phase-pill').forEach(el => el.classList.remove('done', 'active'));
  document.getElementById('verdict-card').classList.remove('show');
  updateProgress();
}

function renderPhases() {
  const l = lang.current;
  const container = document.getElementById('phases-container');
  container.innerHTML = '';

  phases.forEach(phase => {
    const phaseItems = phase.items;
    const checkedInPhase = phaseItems.filter(item => state[item.id]).length;
    const isComplete = checkedInPhase === phaseItems.length;

    const phaseEl = document.createElement('div');
    phaseEl.className = `phase${isComplete ? ' phase-complete' : ''} open`;
    phaseEl.id = `phase-${phase.id}`;

    const tagColors = {
      critical: `<span class="check-tag tag-critical">${l === 'id' ? 'KRITIS' : 'CRITICAL'}</span>`,
      warn: `<span class="check-tag tag-warn">${l === 'id' ? 'PERHATIAN' : 'WARNING'}</span>`,
      info: `<span class="check-tag tag-info">INFO</span>`,
    };

    let itemsHTML = '';
    phaseItems.forEach(item => {
      const isChecked = state[item.id];
      itemsHTML += `
        <div class="check-item${isChecked ? ' checked' : ''}" data-id="${item.id}" onclick="toggleItem('${item.id}')">
          <div class="check-box"><span class="check-icon">✓</span></div>
          <div class="check-content">
            <div class="check-title">${item.title[l]}</div>
            <div class="check-desc">${item.desc[l]}</div>
          </div>
          ${tagColors[item.tag] || ''}
        </div>
      `;
      if (item.hasLinks) {
        itemsHTML += `
          <div class="imei-section">
            <div class="imei-label">${translations.imeiLabel[l]}</div>
            <div class="imei-links">
              ${imeiLinks.map(link => `<a href="${link.url}" target="_blank" class="imei-link">${link.emoji} ${link.label}</a>`).join('')}
            </div>
          </div>
        `;
      }
    });

    phaseEl.innerHTML = `
      <div class="phase-header" onclick="togglePhase(${phase.id})">
        <div class="phase-num">${isComplete ? '✓' : (phase.id + 1)}</div>
        <div class="phase-title-wrap">
          <div class="phase-title">${phase.title[l]}</div>
          <div class="phase-meta">${checkedInPhase}/${phaseItems.length} ${l === 'id' ? 'selesai' : 'done'}</div>
        </div>
        <div class="phase-chevron">▾</div>
      </div>
      <div class="phase-body">${itemsHTML}</div>
    `;

    container.appendChild(phaseEl);
  });
}

// Init
renderPhases();
updateProgress();
updatePhasePills();
</script>
</body>
</html>
